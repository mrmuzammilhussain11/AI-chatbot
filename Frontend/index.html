<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MuzX AI | Intelligent Assistant</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-container">
        <aside class="sidebar">
            <div class="logo">
                <i class="fa-solid fa-robot"></i> MuzX's AI
            </div>
            
            <div class="menu-label">AI MODES</div>
            <ul class="modes-list">
                <li class="mode-item active" data-mode="normal">
                    <i class="fa-regular fa-comments"></i> Normal Chat
                </li>
                <li class="mode-item" data-mode="study">
                    <i class="fa-solid fa-graduation-cap"></i> Study Assistant
                </li>
                <li class="mode-item" data-mode="code">
                    <i class="fa-solid fa-code"></i> Code Helper
                </li>
                <li class="mode-item" data-mode="content">
                    <i class="fa-solid fa-pen-nib"></i> Content Writer
                </li>
                <li class="mode-item" data-mode="english">
                    <i class="fa-solid fa-language"></i> English Practice
                </li>
            </ul>

            <div class="bottom-actions">
                <button id="clear-btn" class="secondary-btn">
                    <i class="fa-solid fa-trash"></i> Clear Chat
                </button>
            </div>
        </aside>

        <main class="chat-area">
            <header class="chat-header">
                <h2 id="current-mode-title">Normal Chat</h2>
                <div class="status-indicator">
                    <span class="dot"></span> Online
                </div>
            </header>

            <div id="chat-box" class="chat-box">
                <div class="message bot-message">
                    <div class="message-content">
                        Hello! I am MuzX. Select a mode from the left and let's start.
                    </div>
                </div>
            </div>

            <div class="input-area">
                <div class="input-container">
                    <input type="text" id="user-input" placeholder="Type a message..." autocomplete="off">
                    <button id="send-btn">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
